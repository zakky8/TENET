<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- title -->
  <text x="80" y="160" font-size="92" font-weight="800" fill="#fff" letter-spacing="-2">TENET</text>
  <rect x="80" y="180" width="240" height="6" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="80" y="240" font-size="32" font-weight="600" fill="#c9d1d9">Verification-first AI agent framework</text>

  <!-- highlights grid -->
  <g font-size="22" font-weight="500" fill="#8b949e">
    <text x="80" y="320">✓ Multi-judge hallucination verifier + Vectara HHEM-2.1</text>
    <text x="80" y="356">✓ Pre-tool-call governance + approval gates + audit trail</text>
    <text x="80" y="392">✓ WASM tool sandbox with capability tokens (wasmtime adapter)</text>
    <text x="80" y="428">✓ MCP OAuth gateway (RFC 9207, 2026-07-28 spec RC)</text>
    <text x="80" y="464">✓ 10 surfaces: Discord · Slack · Telegram · Teams · Web · REST · gRPC · 4 ticketing</text>
    <text x="80" y="500">✓ BENCHMARKS gated in CI on every PR — 11/11 dimensions measured</text>
  </g>

  <!-- stats row -->
  <g font-size="20" fill="#c9d1d9">
    <rect x="80" y="540" width="200" height="64" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="100" y="568" font-size="14" fill="#8b949e">TESTS</text>
    <text x="100" y="594" font-size="28" font-weight="700" fill="#3fb950">766 passing</text>

    <rect x="296" y="540" width="200" height="64" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="316" y="568" font-size="14" fill="#8b949e">PACKAGES</text>
    <text x="316" y="594" font-size="28" font-weight="700" fill="#58a6ff">42 workspace</text>

    <rect x="512" y="540" width="200" height="64" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="532" y="568" font-size="14" fill="#8b949e">CVEs</text>
    <text x="532" y="594" font-size="28" font-weight="700" fill="#3fb950">0</text>

    <rect x="728" y="540" width="280" height="64" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="748" y="568" font-size="14" fill="#8b949e">LICENSE</text>
    <text x="748" y="594" font-size="28" font-weight="700" fill="#fff">Apache-2.0 · TypeScript</text>
  </g>

  <!-- repo url -->
  <text x="1180" y="608" font-size="18" text-anchor="end" fill="#58a6ff" font-weight="500">github.com/zakky8/TENET</text>
</svg>
