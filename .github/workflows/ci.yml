name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SECURITY 2026-06-04 vuln-test #SC2: minimum-privilege top-level.
# Only the trivy job actually writes security-events; that's granted
# at the job level below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version intentionally not pinned here — package.json packageManager
        # field is the single source of truth (Corepack-compatible).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test + coverage gate (thresholds in jest.config.cjs)
        run: pnpm test:coverage
      - name: Doc counts match the live suite (no stale numbers)
        run: pnpm counts:check
      - name: README code examples compile against the real API
        run: pnpm readme:check
      - name: AEO structured data (JSON-LD) parses and is well-formed
        run: pnpm jsonld:check

  audit:
    name: pnpm audit (informational pre-1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pre-1.0: we have no production dependencies beyond workspace packages.
    # All current advisories come from dev-only transitives (jest, ts-jest,
    # rimraf chain). Tighten to a hard gate once @tenet/* ship real prod deps.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version intentionally not pinned here — package.json packageManager
        # field is the single source of truth (Corepack-compatible).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level critical

  trivy:
    name: Trivy filesystem scan (informational pre-1.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pre-1.0: report-only. Findings show in the Security tab via SARIF
    # upload but do not block the build. Tighten to exit-code:'1' on the
    # 1.0 milestone once we have a stable dep surface.
    continue-on-error: true
    # SECURITY 2026-06-04 vuln-test #SC2: scope security-events:write
    # to ONLY the job that needs it (Trivy SARIF upload). Top-level
    # is contents:read only.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # SECURITY 2026-06-04 vuln-test #SC1: pin Trivy action to a tagged
      # release. `@master` pulled arbitrary upstream commits with our CI
      # token — supply-chain risk. SHA verified live against
      # repos/aquasecurity/trivy-action/git/refs/tags/v0.36.0 (the latest
      # tagged release on 2026-06-04). Renovate-bot can bump on a
      # controlled cadence.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  benchmarks-gate:
    name: BENCHMARKS gate (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hermetic — no secrets, no network. Runs every BENCHMARKS dimension
    # against bundled fixtures + the deterministic stub SUT and exits
    # non-zero on any FAIL or MISSING verdict. The numbers measured here
    # are the framework's measurement plane, not a frontier-model claim.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tenet/eval-metrics build
      - run: pnpm --filter @tenet/eval-measure build
      - name: Run measure CLI (gate)
        run: pnpm benchmarks
      - name: Capture measured.json
        if: always()
        run: pnpm benchmarks:json > measured.json || true
      - name: Upload measurement artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-${{ github.sha }}
          path: measured.json
          retention-days: 90
