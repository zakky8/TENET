name: Feature request
description: Propose a new capability or a change to existing behavior.
title: "feat: <one-line summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Strongest proposals describe the *problem* first and the implementation second.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Concrete user / operator scenario. Not "X would be cool" — "today, when Y happens, the operator can't Z."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Rough sketch of how it could work. API shape, config field, new package, whatever fits.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about? Why are they worse?
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which package(s) would this touch?
      multiple: true
      options:
        - "@tenet/core"
        - "@tenet/verifier"
        - "@tenet/retrieval"
        - "@tenet/policy"
        - "@tenet/telemetry"
        - "@tenet/rate-limit"
        - new package
        - surfaces/*
        - connectors/*
        - models/*
        - stores/*
        - docs / infra only
    validations:
      required: true

  - type: dropdown
    id: scale
    attributes:
      label: Scale
      description: Roughly how big is this?
      options:
        - small (single function / config field)
        - medium (new module within an existing package)
        - large (new package or cross-package change)
        - architectural (changes the framework's shape)
    validations:
      required: true

  - type: checkboxes
    id: align
    attributes:
      label: Alignment with project values
      description: TENET's values are documented in [CONTRIBUTING.md](https://github.com/zakky8/TENET/blob/main/CONTRIBUTING.md). Tick what applies.
      options:
        - label: This proposal supports verification by default.
        - label: This proposal supports source-grounded output.
        - label: This proposal does not introduce a CVE-class risk (no unsafe deserialization, no Jinja2 default, no raw-path I/O, no unparameterized queries).
        - label: This proposal would not make the framework specific to one application.
